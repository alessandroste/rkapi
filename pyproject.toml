[project]
name = "rkllm-openai"
version = "0.1.0"
description = "An OpenAI-compatible API server for Rockchip RKLLM inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.1",
    "pillow>=12.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.40.0",
]

[dependency-groups]
build = [
    "pybind11>=3.1.0",
]
